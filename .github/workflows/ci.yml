name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Update Rust
      run: |
        rustup update stable
        rustc --version
    - name: Install Protoc
      run: |
        sudo apt-get update
        sudo apt-get -y install protobuf-compiler libprotobuf-dev
    - name: Validate
      run: |
        cargo fmt --all -- --check
        cargo clippy -p netavark -- -D warnings
    - name: Build
      run: cargo check --all-targets
    - name: Unit tests
      run: cargo test

  freebsd-cross:
    name: FreeBSD (cross-check from Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Update Rust
      run: |
        rustup update stable
        rustup target add x86_64-unknown-freebsd
    - name: Install Protoc
      run: |
        sudo apt-get update
        sudo apt-get -y install protobuf-compiler libprotobuf-dev
    - name: Clippy
      run: cargo clippy --target x86_64-unknown-freebsd -p netavark -- -D warnings
    - name: Build
      run: cargo check --target x86_64-unknown-freebsd --all-targets

  freebsd:
    name: FreeBSD (unit tests)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Unit tests in a FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        release: "15.1"
        prepare: |
          pkg install -y rust protobuf
        run: |
          rustc --version
          cargo test
